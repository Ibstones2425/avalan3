<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Setup — Avalan3</title>
  <meta name="description" content="Set up your Avalan3 profile">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages/onboarding.css">
  <link rel="manifest" href="/manifest.json">
  <script src="/js/config.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js" defer></script>
  <script src="/js/firebase-init.js" defer></script>
  <script src="/js/theme.js" defer></script>
  <script src="/js/utils.js" defer></script>
  <script src="/js/db.js" defer></script>
  <script src="/js/pages/onboarding.js" defer></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
  </script>
</head>
<body class="onboarding-body">

  <div class="onboarding-shell">

    <!-- Header -->
    <header class="onboarding-header">
      <div class="onboarding-logo">Avalan3</div>
      <div class="onboarding-step-indicator" id="step-indicator">1 of 2</div>
    </header>

    <!-- Progress bar -->
    <div class="onboarding-progress">
      <div class="onboarding-progress__fill" id="progress-fill" style="width: 50%"></div>
    </div>

    <!-- ─── STEP 1: PICK YOUR LANE ─── -->
    <section class="onboarding-step onboarding-step--active" id="step-1">
      <div class="onboarding-step__header">
        <h1 class="onboarding-step__title">What's your lane?</h1>
        <p class="onboarding-step__subtitle">Pick what you specialise in. This personalises your AI guide and toolkit.</p>
      </div>

      <div class="onboarding-options" id="lane-options">

        <button class="onboarding-option" data-value="community-manager" type="button">
          <div class="onboarding-option__content">
            <span class="onboarding-option__title">Community Manager</span>
            <span class="onboarding-option__desc">Discord, Telegram, Twitter community growth and ops</span>
          </div>
          <div class="onboarding-option__check" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </button>

        <button class="onboarding-option" data-value="content-creator" type="button">
          <div class="onboarding-option__content">
            <span class="onboarding-option__title">Content Creator</span>
            <span class="onboarding-option__desc">Threads, articles, newsletters, project narratives</span>
          </div>
          <div class="onboarding-option__check" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </button>

        <button class="onboarding-option" data-value="shiller" type="button">
          <div class="onboarding-option__content">
            <span class="onboarding-option__title">Shiller / Raider</span>
            <span class="onboarding-option__desc">Token promotion, CT raids, hype and growth campaigns</span>
          </div>
          <div class="onboarding-option__check" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </button>

        <button class="onboarding-option" data-value="developer" type="button">
          <div class="onboarding-option__content">
            <span class="onboarding-option__title">Developer</span>
            <span class="onboarding-option__desc">Smart contracts, dApps, bots, tooling, infrastructure</span>
          </div>
          <div class="onboarding-option__check" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </button>

        <button class="onboarding-option" data-value="designer" type="button">
          <div class="onboarding-option__content">
            <span class="onboarding-option__title">Designer</span>
            <span class="onboarding-option__desc">UI/UX, NFT art, branding, social media visuals</span>
          </div>
          <div class="onboarding-option__check" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </button>

      </div>

      <div class="onboarding-actions">
        <button class="btn-primary" id="btn-next-1" type="button" disabled>Continue</button>
      </div>
    </section>

    <!-- ─── STEP 2: HOW YOU FIND WORK ─── -->
    <section class="onboarding-step" id="step-2">
      <div class="onboarding-step__header">
        <h1 class="onboarding-step__title">How do you find work?</h1>
        <p class="onboarding-step__subtitle">This shapes which tools and DM approaches your AI guide recommends.</p>
      </div>

      <div class="onboarding-options" id="workstyle-options">

        <button class="onboarding-option" data-value="dm-outreach" type="button">
          <div class="onboarding-option__content">
            <span class="onboarding-option__title">Direct Outreach</span>
            <span class="onboarding-option__desc">I cold DM projects on Twitter, Discord, and Telegram</span>
          </div>
          <div class="onboarding-option__check" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </button>

        <button class="onboarding-option" data-value="job-boards" type="button">
          <div class="onboarding-option__content">
            <span class="onboarding-option__title">Job Boards</span>
            <span class="onboarding-option__desc">I apply through CryptoJobsList, web3.career, LaborX, etc.</span>
          </div>
          <div class="onboarding-option__check" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </button>

        <button class="onboarding-option" data-value="both" type="button">
          <div class="onboarding-option__content">
            <span class="onboarding-option__title">Both</span>
            <span class="onboarding-option__desc">I mix direct outreach with job board applications</span>
          </div>
          <div class="onboarding-option__check" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </button>

      </div>

      <div class="onboarding-actions onboarding-actions--row">
        <button class="btn-secondary" id="btn-back-2" type="button">Back</button>
        <button class="btn-primary" id="btn-finish" type="button" disabled>
          <span id="finish-label">Get Started</span>
          <span id="finish-spinner" class="spinner" hidden></span>
        </button>
      </div>
    </section>

    <!-- Error toast -->
    <div class="onboarding-error" id="onboarding-error" hidden>
      <span id="onboarding-error-text">Something went wrong. Please try again.</span>
    </div>

  </div>

</body>
</html>
