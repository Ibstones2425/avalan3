<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>My Journey — Avalan3</title>
  <meta name="description" content="Track your Web3 earning journey step by step — from Stage 0 to earning.">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages/journey.css">

  <!-- Manifest -->
  <link rel="manifest" href="/manifest.json">

  <!-- Config (must load before Firebase init) -->
  <script src="/js/config.js" defer></script>

  <!-- Firebase CDN compat v10 -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js" defer></script>

  <!-- App scripts (defer, order matters) -->
  <script src="/js/firebase-init.js" defer></script>
  <script src="/js/auth-guard.js" defer></script>
  <script src="/js/theme.js" defer></script>
  <script src="/js/utils.js" defer></script>
  <script src="/js/db.js" defer></script>
  <script src="/js/pages/journey.js" defer></script>

  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</head>
<body class="journey-page">

  <!-- ═══════════════════════════════════════════════════════════
       TOP BAR
       ═══════════════════════════════════════════════════════════ -->
  <header class="journey-topbar">
    <h1 class="journey-topbar__title">My Journey</h1>
    <button class="journey-topbar__action" type="button" aria-label="Settings">
      <!-- Settings gear icon -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </header>

  <!-- ═══════════════════════════════════════════════════════════
       MAIN CONTENT
       ═══════════════════════════════════════════════════════════ -->
  <main>

    <!-- Loading skeleton (shown while data loads) -->
    <div id="journey-skeleton" class="journey-skeleton">
      <div class="skeleton-card"><div class="skeleton-circle"></div><div class="skeleton-lines"><div class="skeleton-line"></div><div class="skeleton-line"></div></div></div>
      <div class="skeleton-card"><div class="skeleton-circle"></div><div class="skeleton-lines"><div class="skeleton-line"></div><div class="skeleton-line"></div></div></div>
      <div class="skeleton-card"><div class="skeleton-circle"></div><div class="skeleton-lines"><div class="skeleton-line"></div><div class="skeleton-line"></div></div></div>
      <div class="skeleton-card"><div class="skeleton-circle"></div><div class="skeleton-lines"><div class="skeleton-line"></div><div class="skeleton-line"></div></div></div>
      <div class="skeleton-card"><div class="skeleton-circle"></div><div class="skeleton-lines"><div class="skeleton-line"></div><div class="skeleton-line"></div></div></div>
      <div class="skeleton-card"><div class="skeleton-circle"></div><div class="skeleton-lines"><div class="skeleton-line"></div><div class="skeleton-line"></div></div></div>
    </div>

    <!-- Stage roadmap (rendered by journey.js) -->
    <div id="journey-roadmap" class="journey-roadmap" style="display:none;" role="list" aria-label="Journey stages"></div>

  </main>

  <!-- ═══════════════════════════════════════════════════════════
       BOTTOM NAV
       ═══════════════════════════════════════════════════════════ -->
  <nav class="bottomnav" aria-label="Main navigation">

    <!-- Home -->
    <a href="/" class="bottomnav__item" aria-label="Home">
      <svg class="bottomnav__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span class="bottomnav__label">Home</span>
    </a>

    <!-- Journey (active) -->
    <a href="/journey.html" class="bottomnav__item bottomnav__item--active" aria-current="page" aria-label="Journey">
      <svg class="bottomnav__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      <span class="bottomnav__label">Journey</span>
    </a>

    <!-- Explore -->
    <a href="/explore.html" class="bottomnav__item" aria-label="Explore">
      <svg class="bottomnav__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <span class="bottomnav__label">Explore</span>
    </a>

    <!-- AI -->
    <a href="/ai.html" class="bottomnav__item" aria-label="AI">
      <svg class="bottomnav__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a4 4 0 0 1 4 4v2a4 4 0 0 1-8 0V6a4 4 0 0 1 4-4z"/>
        <path d="M12 18v4"/>
        <path d="M8 18h8"/>
        <path d="M6 10a6 6 0 0 0 12 0"/>
      </svg>
      <span class="bottomnav__label">AI</span>
    </a>

    <!-- Tracker -->
    <a href="/tracker.html" class="bottomnav__item" aria-label="Tracker">
      <svg class="bottomnav__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="20" x2="18" y2="10"/>
        <line x1="12" y1="20" x2="12" y2="4"/>
        <line x1="6" y1="20" x2="6" y2="14"/>
      </svg>
      <span class="bottomnav__label">Tracker</span>
    </a>

  </nav>

</body>
</html>
