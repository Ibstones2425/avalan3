<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Avalan3 — Page not found">
  <title>Avalan3 — 404</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">

  <!-- Manifest -->
  <link rel="manifest" href="/manifest.json">

  <!-- Theme -->
  <script src="/js/theme.js" defer></script>

  <style>
    .notfound-shell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      padding: var(--space-8) var(--space-6);
      text-align: center;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      gap: var(--space-5);
    }

    .notfound-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: var(--radius-lg);
      background: var(--brand-primary-subtle);
      color: var(--brand-primary);
      flex-shrink: 0;
    }

    .notfound-logo svg {
      width: 28px;
      height: 28px;
    }

    .notfound-code {
      font-size: var(--font-size-5xl);
      font-weight: var(--font-weight-extrabold);
      color: var(--text-primary);
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .notfound-subtitle {
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-medium);
      color: var(--text-secondary);
      margin-top: calc(-1 * var(--space-2));
    }

    .notfound-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-3);
      margin-top: var(--space-2);
    }

    .notfound-actions .btn {
      min-width: 200px;
    }

    .notfound-actions .btn-ghost {
      font-size: var(--font-size-sm);
    }
  </style>
</head>
<body>
  <div class="notfound-shell">

    <!-- A3 Logo -->
    <div class="notfound-logo" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M14 2L3 8v12l11 6 11-6V8L14 2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M3 8l11 6 11-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M14 26V14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <text x="14" y="18" text-anchor="middle" fill="currentColor" font-size="10" font-weight="700" font-family="Inter, sans-serif">A3</text>
      </svg>
    </div>

    <!-- 404 -->
    <h1 class="notfound-code">404</h1>
    <p class="notfound-subtitle">Page not found</p>

    <!-- Actions -->
    <div class="notfound-actions">
      <a href="/dashboard.html" class="btn btn-md btn-primary">Go to Dashboard</a>
      <a href="/index.html" class="btn btn-md btn-ghost">Go to Home</a>
    </div>

  </div>

  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
