<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0EA5E9">
  <meta name="description" content="Sign up or log in to Avalan3 — your Web3 earning journey starts here.">
  <title>Auth — Avalan3</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages/auth.css">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">

  <!-- Config (must load before Firebase init) -->
  <script src="/js/config.js" defer></script>

  <!-- Firebase Compat SDK v10 -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- App Scripts -->
  <script src="/js/firebase-init.js" defer></script>
  <script src="/js/theme.js" defer></script>
  <script src="/js/utils.js" defer></script>
  <script src="/js/pages/auth.js" defer></script>
</head>
<body>

  <main class="auth-page">

    <!-- ── Logo ────────────────────────────────────── -->
    <div class="auth-logo">
      <a href="/index.html" class="auth-logo__link" aria-label="Avalan3 home">A3</a>
    </div>

    <!-- ── Error Banner (shared across modes) ─────── -->
    <div id="auth-error-banner" class="auth-error-banner" role="alert">
      <svg class="auth-error-banner__icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-3.54 4.46a.75.75 0 10-1.06-1.06L10 11.06 7.6 13.46a.75.75 0 01-1.06-1.06L8.94 10 6.54 7.6a.75.75 0 011.06-1.06L10 8.94l2.4-2.4a.75.75 0 011.06 1.06L11.06 10l2.4 2.4a.75.75 0 010 1.06z" clip-rule="evenodd"/>
      </svg>
      <span id="auth-error-banner-text"></span>
    </div>

    <!-- ══════════════════════════════════════════════ -->
    <!-- SIGN UP MODE                                   -->
    <!-- ══════════════════════════════════════════════ -->
    <div id="auth-signup" class="auth-mode active">
      <div class="auth-card">
        <div class="auth-header">
          <h2 class="auth-header__title">Create your account</h2>
          <p class="auth-header__subtitle">Start your Web3 journey free</p>
        </div>

        <form id="signup-form" class="auth-form" novalidate autocomplete="on">

          <!-- Full Name -->
          <div class="auth-field">
            <label for="signup-name" class="auth-field__label">Full Name</label>
            <input
              id="signup-name"
              type="text"
              class="auth-field__input auth-field__input--no-toggle"
              placeholder="Your full name"
              autocomplete="name"
              required
            >
            <div id="signup-name-error" class="auth-field__error" aria-live="polite"></div>
          </div>

          <!-- Email -->
          <div class="auth-field">
            <label for="signup-email" class="auth-field__label">Email</label>
            <input
              id="signup-email"
              type="email"
              class="auth-field__input auth-field__input--no-toggle"
              placeholder="you@example.com"
              autocomplete="email"
              required
            >
            <div id="signup-email-error" class="auth-field__error" aria-live="polite"></div>
          </div>

          <!-- Password -->
          <div class="auth-field auth-field--password">
            <label for="signup-password" class="auth-field__label">Password</label>
            <input
              id="signup-password"
              type="password"
              class="auth-field__input"
              placeholder="At least 6 characters"
              autocomplete="new-password"
              required
            >
            <button type="button" id="toggle-signup-password" class="auth-field__toggle" aria-label="Show password" tabindex="-1">
              <!-- Eye open (default: password hidden) -->
              <svg class="icon-eye-open" viewBox="0 0 20 20" fill="currentColor" style="display:block">
                <path d="M10 12.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5z"/>
                <path fill-rule="evenodd" d="M.664 10.59a1.652 1.652 0 010-1.186A10.003 10.003 0 0110 3c4.257 0 7.893 2.66 9.336 6.41a1.652 1.652 0 010 1.186A10.003 10.003 0 0110 17c-4.257 0-7.893-2.66-9.336-6.41zM10 5a8 8 0 00-7.948 6A8 8 0 0010 15a8 8 0 007.948-6A8 8 0 0010 5z" clip-rule="evenodd"/>
              </svg>
              <!-- Eye closed (password visible) -->
              <svg class="icon-eye-closed" viewBox="0 0 20 20" fill="currentColor" style="display:none">
                <path fill-rule="evenodd" d="M3.28 2.22a.75.75 0 00-1.06 1.06l14.5 14.5a.75.75 0 101.06-1.06l-1.733-1.733A10.003 10.003 0 0110 3C6.36 3 3.21 5.15 1.66 8.41a1.652 1.652 0 000 1.186 9.96 9.96 0 002.27 3.55l-1.65 1.65zm12.475 8.817A8 8 0 002.088 7.55l2.916 2.916a5 5 0 008.044 3.975l2.707 2.707A10.003 10.003 0 0110 17c3.64 0 6.79-2.15 8.34-5.41a1.652 1.652 0 000-1.186 9.955 9.955 0 00-2.585-3.366z" clip-rule="evenodd"/>
              </svg>
            </button>
            <div id="signup-password-error" class="auth-field__error" aria-live="polite"></div>
          </div>

          <!-- Confirm Password -->
          <div class="auth-field auth-field--password">
            <label for="signup-confirm-password" class="auth-field__label">Confirm Password</label>
            <input
              id="signup-confirm-password"
              type="password"
              class="auth-field__input"
              placeholder="Re-enter your password"
              autocomplete="new-password"
              required
            >
            <button type="button" id="toggle-signup-confirm-password" class="auth-field__toggle" aria-label="Show password" tabindex="-1">
              <svg class="icon-eye-open" viewBox="0 0 20 20" fill="currentColor" style="display:block">
                <path d="M10 12.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5z"/>
                <path fill-rule="evenodd" d="M.664 10.59a1.652 1.652 0 010-1.186A10.003 10.003 0 0110 3c4.257 0 7.893 2.66 9.336 6.41a1.652 1.652 0 010 1.186A10.003 10.003 0 0110 17c-4.257 0-7.893-2.66-9.336-6.41zM10 5a8 8 0 00-7.948 6A8 8 0 0010 15a8 8 0 007.948-6A8 8 0 0010 5z" clip-rule="evenodd"/>
              </svg>
              <svg class="icon-eye-closed" viewBox="0 0 20 20" fill="currentColor" style="display:none">
                <path fill-rule="evenodd" d="M3.28 2.22a.75.75 0 00-1.06 1.06l14.5 14.5a.75.75 0 101.06-1.06l-1.733-1.733A10.003 10.003 0 0110 3C6.36 3 3.21 5.15 1.66 8.41a1.652 1.652 0 000 1.186 9.96 9.96 0 002.27 3.55l-1.65 1.65zm12.475 8.817A8 8 0 002.088 7.55l2.916 2.916a5 5 0 008.044 3.975l2.707 2.707A10.003 10.003 0 0110 17c3.64 0 6.79-2.15 8.34-5.41a1.652 1.652 0 000-1.186 9.955 9.955 0 00-2.585-3.366z" clip-rule="evenodd"/>
              </svg>
            </button>
            <div id="signup-confirm-password-error" class="auth-field__error" aria-live="polite"></div>
          </div>

          <!-- Submit -->
          <button id="signup-submit" type="submit" class="auth-submit">
            <span class="auth-submit__text">Create Account</span>
            <span class="auth-submit__spinner" style="display:none"></span>
          </button>
        </form>

        <!-- Divider -->
        <div class="auth-divider">
          <span class="auth-divider__line"></span>
          <span class="auth-divider__text">or</span>
          <span class="auth-divider__line"></span>
        </div>

        <!-- Google OAuth -->
        <button type="button" class="auth-oauth" aria-label="Continue with Google">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M19.6 10.23c0-.64-.06-1.26-.16-1.87H10v3.55h5.38a4.6 4.6 0 01-2 3.02v2.52h3.22c1.88-1.73 3-4.28 3-7.22z" fill="#4285F4"/>
            <path d="M10 20c2.7 0 4.96-.9 6.6-2.42l-3.22-2.52c-.9.6-2.04.95-3.38.95-2.6 0-4.8-1.76-5.58-4.12H1.1v2.6A9.997 9.997 0 0010 20z" fill="#34A853"/>
            <path d="M4.42 11.9A6.03 6.03 0 014.1 10c0-.66.11-1.3.32-1.9V5.5H1.1A9.997 9.997 0 000 10c0 1.62.39 3.15 1.1 4.5l3.32-2.6z" fill="#FBBC05"/>
            <path d="M10 3.98c1.47 0 2.8.5 3.84 1.5l2.87-2.87C14.96.95 12.7 0 10 0 5.84 0 2.23 2.58 1.1 5.5l3.32 2.6C5.2 5.74 7.4 3.98 10 3.98z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>

        <!-- Footer -->
        <div class="auth-footer">
          Already have an account?
          <button type="button" id="switch-to-login" class="auth-footer__link">Sign in</button>
        </div>
      </div>
    </div>

    <!-- ══════════════════════════════════════════════ -->
    <!-- LOGIN MODE                                     -->
    <!-- ══════════════════════════════════════════════ -->
    <div id="auth-login" class="auth-mode">
      <div class="auth-card">
        <div class="auth-header">
          <h2 class="auth-header__title">Welcome back</h2>
        </div>

        <form id="login-form" class="auth-form" novalidate autocomplete="on">

          <!-- Email -->
          <div class="auth-field">
            <label for="login-email" class="auth-field__label">Email</label>
            <input
              id="login-email"
              type="email"
              class="auth-field__input auth-field__input--no-toggle"
              placeholder="you@example.com"
              autocomplete="email"
              required
            >
            <div id="login-email-error" class="auth-field__error" aria-live="polite"></div>
          </div>

          <!-- Password -->
          <div class="auth-field auth-field--password">
            <label for="login-password" class="auth-field__label">Password</label>
            <input
              id="login-password"
              type="password"
              class="auth-field__input"
              placeholder="Your password"
              autocomplete="current-password"
              required
            >
            <button type="button" id="toggle-login-password" class="auth-field__toggle" aria-label="Show password" tabindex="-1">
              <svg class="icon-eye-open" viewBox="0 0 20 20" fill="currentColor" style="display:block">
                <path d="M10 12.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5z"/>
                <path fill-rule="evenodd" d="M.664 10.59a1.652 1.652 0 010-1.186A10.003 10.003 0 0110 3c4.257 0 7.893 2.66 9.336 6.41a1.652 1.652 0 010 1.186A10.003 10.003 0 0110 17c-4.257 0-7.893-2.66-9.336-6.41zM10 5a8 8 0 00-7.948 6A8 8 0 0010 15a8 8 0 007.948-6A8 8 0 0010 5z" clip-rule="evenodd"/>
              </svg>
              <svg class="icon-eye-closed" viewBox="0 0 20 20" fill="currentColor" style="display:none">
                <path fill-rule="evenodd" d="M3.28 2.22a.75.75 0 00-1.06 1.06l14.5 14.5a.75.75 0 101.06-1.06l-1.733-1.733A10.003 10.003 0 0110 3C6.36 3 3.21 5.15 1.66 8.41a1.652 1.652 0 000 1.186 9.96 9.96 0 002.27 3.55l-1.65 1.65zm12.475 8.817A8 8 0 002.088 7.55l2.916 2.916a5 5 0 008.044 3.975l2.707 2.707A10.003 10.003 0 0110 17c3.64 0 6.79-2.15 8.34-5.41a1.652 1.652 0 000-1.186 9.955 9.955 0 00-2.585-3.366z" clip-rule="evenodd"/>
              </svg>
            </button>
            <div id="login-password-error" class="auth-field__error" aria-live="polite"></div>
          </div>

          <!-- Forgot password link -->
          <div>
            <button type="button" id="switch-to-forgot" class="auth-forgot-link">Forgot password?</button>
          </div>

          <!-- Submit -->
          <button id="login-submit" type="submit" class="auth-submit">
            <span class="auth-submit__text">Sign In</span>
            <span class="auth-submit__spinner" style="display:none"></span>
          </button>
        </form>

        <!-- Divider -->
        <div class="auth-divider">
          <span class="auth-divider__line"></span>
          <span class="auth-divider__text">or</span>
          <span class="auth-divider__line"></span>
        </div>

        <!-- Google OAuth -->
        <button type="button" class="auth-oauth" aria-label="Continue with Google">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M19.6 10.23c0-.64-.06-1.26-.16-1.87H10v3.55h5.38a4.6 4.6 0 01-2 3.02v2.52h3.22c1.88-1.73 3-4.28 3-7.22z" fill="#4285F4"/>
            <path d="M10 20c2.7 0 4.96-.9 6.6-2.42l-3.22-2.52c-.9.6-2.04.95-3.38.95-2.6 0-4.8-1.76-5.58-4.12H1.1v2.6A9.997 9.997 0 0010 20z" fill="#34A853"/>
            <path d="M4.42 11.9A6.03 6.03 0 014.1 10c0-.66.11-1.3.32-1.9V5.5H1.1A9.997 9.997 0 000 10c0 1.62.39 3.15 1.1 4.5l3.32-2.6z" fill="#FBBC05"/>
            <path d="M10 3.98c1.47 0 2.8.5 3.84 1.5l2.87-2.87C14.96.95 12.7 0 10 0 5.84 0 2.23 2.58 1.1 5.5l3.32 2.6C5.2 5.74 7.4 3.98 10 3.98z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>

        <!-- Footer -->
        <div class="auth-footer">
          Don't have an account?
          <button type="button" id="switch-to-signup" class="auth-footer__link">Sign up</button>
        </div>
      </div>
    </div>

    <!-- ══════════════════════════════════════════════ -->
    <!-- FORGOT PASSWORD MODE                           -->
    <!-- ══════════════════════════════════════════════ -->
    <div id="auth-forgot" class="auth-mode">
      <div class="auth-card">
        <div class="auth-header">
          <button type="button" id="back-to-login" class="auth-header__back" aria-label="Back to login">
            <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" d="M9.78 2.22a.75.75 0 010 1.06L5.56 7.5l4.22 4.22a.75.75 0 11-1.06 1.06L3.94 8.03a.75.75 0 010-1.06l4.78-4.78a.75.75 0 011.06 0z" clip-rule="evenodd"/>
            </svg>
            Back
          </button>
          <h2 class="auth-header__title">Reset password</h2>
          <p class="auth-header__subtitle">We'll send you a reset link</p>
        </div>

        <form id="forgot-form" class="auth-form" novalidate autocomplete="on">

          <!-- Email -->
          <div class="auth-field">
            <label for="forgot-email" class="auth-field__label">Email</label>
            <input
              id="forgot-email"
              type="email"
              class="auth-field__input auth-field__input--no-toggle"
              placeholder="you@example.com"
              autocomplete="email"
              required
            >
            <div id="forgot-email-error" class="auth-field__error" aria-live="polite"></div>
          </div>

          <!-- Submit -->
          <button id="forgot-submit" type="submit" class="auth-submit">
            <span class="auth-submit__text">Send Reset Email</span>
            <span class="auth-submit__spinner" style="display:none"></span>
          </button>
        </form>

        <!-- Success Card -->
        <div id="forgot-success" class="auth-success">
          <svg class="auth-success__icon" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="20" cy="20" r="18"/>
            <polyline points="12,20 18,26 28,14"/>
          </svg>
          <p class="auth-success__title">Check your inbox</p>
          <p class="auth-success__desc">We've sent a password reset link to your email. It may take a minute to arrive.</p>
        </div>
      </div>
    </div>

  </main>

  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>

</body>
</html>
